name: Deploy Next.js to Cloudflare Workers

on:
  push:
    branches:
      - main # Altere para 'master' se essa for a sua branch principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write # Necessário para o Pages criar os status de deploy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18'
          cache: 'npm'

      - name: Set up npm
        run: npm install --global npm@12.2.1

      - name: Install Dependencies
        run: npm ci

      # OpenNext constrói a aplicação e publica o Worker no Cloudflare.
      - name: Build and deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_URL_DIRECIONADA: ${{ secrets.NEXT_PUBLIC_URL_DIRECIONADA }}
          EXTERNAL_API_URL: ${{ secrets.EXTERNAL_API_URL }}

      # O secret do Worker só pode ser associado depois da primeira publicação.
      - name: Configure backend URL secret
        run: printf '%s' "$EXTERNAL_API_URL" | npx wrangler secret put EXTERNAL_API_URL --name front-cadastro-interesse-intercambio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_URL_DIRECIONADA: ${{ secrets.NEXT_PUBLIC_URL_DIRECIONADA }}
          EXTERNAL_API_URL: ${{ secrets.EXTERNAL_API_URL }}

      - name: Notificar sucesso via Google Apps Script
        if: success()
        env:
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_WEBAPP_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          STATUS: success
          DETAIL: Deploy realizado com sucesso e aplicação recarregada.
        run: python .github/scripts/notificar_deploy.py

      - name: Notificar falha via Google Apps Script
        if: failure()
        env:
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_WEBAPP_URL }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          STATUS: fail
          DETAIL: A pipeline de deploy falhou durante o envio dos arquivos ou o reload da aplicação.
        run: python .github/scripts/notificar_deploy.py
